# Envio HyperIndex config for Entole — see docs/ARCHITECTURE.md, "Data":
# "Envio HyperIndex for activity feeds and allowance history. Do not read
# history directly from RPC in the app." This file is that indexer's
# contract-facing half.
#
# Three contracts, because money moves through three doors:
#
#   EntoleRouter     every ordinary payment. `Paid` says who paid, who was paid
#                    and how much arrived, in one line, with the payer's salt.
#   EntolePolicy     allowances, the runs the assistant queues inside them, the
#                    payments it makes (`Executed`), pauses and passkeys. Both
#                    deployments are read: the first, and version 2 with the
#                    undo window held on the network.
#   SettlementToken  Agora AUSD itself, for money that reaches an account some
#                    other way: test money, or money sent from another app.
#
# Between them that is every payment an Entole account sends or receives, so
# a person's history can be read here on any device, not only on the one that
# made the payment.
#
# Addresses and start blocks are the real deployments on Monad testnet, from
# contracts/README.md. After a redeploy, put the new address and its
# deployment block here and run `pnpm --filter @entole/indexer codegen`.
#
# Data comes from HyperSync where the chain has it (Monad testnet does); the
# RPC below is the fallback. The public RPC answers a log query only 100
# blocks back, so it could never serve the history on its own.
name: entole-indexer

# Accounts are compared as text by the app; one spelling, all lower-case.
address_format: lowercase

# What every handler may read about the payment an event came in. The hash is
# what makes a row one row, and what ties it to the receipt the app shows.
# Nothing is fetched that is not named here.
field_selection:
  transaction_fields:
    - hash

# The handlers for these are in `src/handlers/`, the one place the index looks
# for them. A handler file anywhere else is never loaded, and an index with no
# handlers has nothing to read and stops as it starts.
contracts:
  - name: EntoleRouter
    events:
      - event: "Paid(address indexed from, address indexed recipient, uint256 amount, uint256 fee, bytes32 salt)"
  - name: EntolePolicy
    abi_file_path: abis/EntolePolicy.json
    events:
      - event: "AllowanceCreated(bytes32 indexed id, address indexed owner, address indexed delegate)"
      - event: "AllowanceRevoked(bytes32 indexed id, address indexed owner)"
      - event: "Paused(address indexed owner, bool paused)"
      - event: "Executed(bytes32 indexed id, address indexed recipient, uint256 amount)"
      - event: "PasskeyRegistered(address indexed owner, uint256 x, uint256 y)"
      - event: "Proposed(bytes32 indexed runId, bytes32 indexed id, address indexed recipient, uint256 amount, uint256 readyAt)"
      - event: "Cancelled(bytes32 indexed runId, bytes32 indexed id)"
      - event: "RunCarriedOut(bytes32 indexed runId, bytes32 indexed id)"
  # The account's own money, for what reaches it some other way than a payment
  # in the app: test money, or money sent in from another app. Movements the
  # two contracts above already record are left out by the handler.
  - name: SettlementToken
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

chains:
  - id: 10143 # Monad testnet — see contracts/README.md's network reference
    rpc: https://testnet-rpc.monad.xyz
    start_block: 64113781 # the router's deployment block, the earlier of the two
    contracts:
      - name: EntoleRouter
        start_block: 64113781
        address:
          - "0x26dfd3aa7601B57d8b7BB9e9555f5Bdac60dAB01"
      - name: EntolePolicy
        start_block: 69645503 # 9 Oct 2026, the version with executeFor
        address:
          - "0xEE9C2cE4FC3a58f88D3E2FCE9807cDcA3A97Ed3e"
          - "0x0d57a7713123C52f2Bfa513F71Ea811f61e67C33" # 15 Oct 2026, version 2: the undo window held on the network, block 71293598
      - name: SettlementToken
        start_block: 64113781
        address:
          - "0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC"
