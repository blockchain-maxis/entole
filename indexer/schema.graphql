# Entities the app reads instead of walking RPC logs itself, per
# docs/ARCHITECTURE.md. Shapes are deliberately close to
# packages/core/schemas.ts's Allowance and Activity types — the boundary
# between "what the indexer stores" and "what the app renders" should stay
# thin, not become a second data model to keep in sync by hand.

type Allowance @entity {
  id: ID! # the on-chain bytes32 allowance id, as a hex string
  owner: String!
  delegate: String!
  revoked: Boolean!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTx: String!
}

# One row per settled execute() call — the on-chain source of truth for the
# activity feed's "assistant-initiated" entries. The app still resolves the
# human-facing contact name and note off-chain; this entity only carries
# what actually happened on-chain.
type Execution @entity {
  id: ID! # `${txHash}-${logIndex}`
  allowance: Allowance!
  recipient: String!
  amountMinor: BigInt!
  timestamp: BigInt!
  txHash: String!
}

# One row per payment that settled, whichever door it went through: an
# ordinary send through the router, or one the assistant made inside an
# allowance. This is what a person's history is read from. `from` and `to` are
# accounts, lower-case, and are what the app asks by; the app turns them into
# people and never shows them.
type Payment @entity {
  id: ID! # `${txHash}-${logIndex}`
  from: String! @index
  to: String! @index
  # What the person paid received, in the settlement asset's base units.
  amount: BigInt!
  # What the payer was charged on top. Zero for a payment inside an allowance.
  fee: BigInt!
  timestamp: BigInt! @index
  txHash: String!
  # True when the assistant made it, inside an allowance.
  byAssistant: Boolean!
  # Which way it moved: "router" (an ordinary payment), "allowance" (the
  # assistant, inside an allowance) or "transfer" (money sent to or from the
  # account some other way: test money, another app).
  door: String!
  # The payer's salt, for a payment through the router. A payment made from an
  # invoice link carries the invoice's tag in its first half.
  salt: String
}

# A run the assistant proposed inside an allowance, waiting out its undo
# window on the network (EntolePolicy version 2). It ends carried out, or
# cancelled by the owner or the assistant, or stale with nobody acting on it.
type AssistantRun @entity {
  id: ID! # the run id
  allowance: Allowance!
  recipient: String!
  amount: BigInt!
  readyAt: BigInt!
  # "waiting", "carried-out" or "cancelled".
  state: String!
  proposedAt: BigInt!
  txHash: String!
}

type PauseChange @entity {
  id: ID! # `${txHash}-${logIndex}`
  owner: String!
  paused: Boolean!
  timestamp: BigInt!
}

# The passkey an owner registered for revocation. One row per registration; a
# later registration by the same owner is a new row, newest wins.
type PasskeyRegistration @entity {
  id: ID! # `${txHash}-${logIndex}`
  owner: String!
  x: BigInt!
  y: BigInt!
  timestamp: BigInt!
}
