name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: typecheck, lint, test — apps and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  contracts:
    name: forge test — the policy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        working-directory: contracts
        run: forge test -vvv

      - name: forge build
        working-directory: contracts
        run: forge build --sizes

  indexer:
    name: envio — the payment index, generated, checked and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # codegen is local and needs no token. It writes the types the handlers
      # are checked against, so it only proves config and schema are well formed.
      # The native envio binary runs on Linux, which it does not on every dev box.
      - name: codegen
        working-directory: indexer
        run: pnpm codegen

      # The handlers against those types. Reading a field the config does not
      # ask for is an error here; generation alone never noticed.
      - name: check
        working-directory: indexer
        run: pnpm check

      # The handlers themselves, run over events made in the test, and what
      # they stored read back. Nothing is mocked between the two.
      - name: handlers
        working-directory: indexer
        run: pnpm test:handlers
